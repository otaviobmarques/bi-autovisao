<style>
*{box-sizing:border-box}body{margin:0}.layout{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
aside{background:white;border-right:1px solid var(--av-line);border-top:4px solid var(--av-red);padding:24px 18px}main{padding:24px;min-width:0}
.brand{font:900 22px var(--av-font-title);border-left:4px solid var(--av-red);padding-left:12px;margin-bottom:24px;color:var(--av-graphite)}
.brand img{display:block;width:100%;max-width:190px;height:auto;margin-bottom:12px}
h1{margin:0;font-size:clamp(26px,4vw,38px)}h2{margin:0;font-size:19px}p{margin:6px 0;color:var(--av-gray)}
.dashboard-header{position:sticky;top:0;z-index:2;background:var(--av-offwhite);margin-top:-24px;padding:24px 0 8px}
@media(max-width:820px){.dashboard-header{margin-top:-16px;padding-top:16px}}
label{display:grid;gap:4px;margin:10px 0;font:500 12px var(--av-font-action)}select,button{width:100%;min-height:40px;padding:6px 9px;border:1px solid var(--av-line);border-radius:8px;background:white;color:var(--av-black)}
button{cursor:pointer}button:hover{border-color:var(--av-red-deep)}
.cards,.charts{display:grid;gap:14px;margin-top:16px}.cards{grid-template-columns:repeat(3,minmax(0,1fr))}.charts{grid-template-columns:repeat(2,minmax(0,1fr))}
.panel{background:white;border:1px solid var(--av-line);border-radius:var(--av-radius);padding:16px;min-width:0}
.metric{border-top:4px solid var(--av-red)}.metric strong{display:block;font:900 clamp(22px,3vw,32px) var(--av-font-title);margin:4px 0}
.metric small{display:block;color:var(--av-gray)}.comparison{margin-top:6px;font-size:13px}.change{font-weight:900}.positive{color:#137547}.negative{color:var(--av-red-deep)}
.metric-footer .nominal{display:block;margin-top:4px;text-align:center;font:900 18px var(--av-font-title);font-variant-numeric:tabular-nums}
.chart-header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.chart-header select{width:auto}
.panel.sales-chart{padding:10px 13px}
.sales-chart h2{font-size:16px}
.sales-chart :is(button,select){min-height:32px;width:auto;font-size:13px}
.sales-chart button[aria-pressed=true]{background:#bf1515;color:white}
.sales-chart button[data-mode=meta][aria-pressed=true]{background:#155ab5;color:white}
.sales-chart .evolution svg{max-height:265px}
.sales-chart .evolution svg text{font-size:11px}
.sales-chart .legend{margin-top:8px;font-size:12px}
.bars{max-height:325px;overflow:auto;margin-top:12px;padding:4px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px 12px;align-items:center;min-height:54px;padding:9px 8px;text-align:left;border:0;border-bottom:1px solid #ededed;border-radius:6px;font-size:14px;line-height:1.3;color:var(--av-graphite)}
button.bar:hover,button.bar[aria-pressed=true]{background:var(--av-red-soft)}.bar strong{font-variant-numeric:tabular-nums;white-space:nowrap}.track{grid-column:1/-1;background:#eee;height:7px;border-radius:8px;overflow:hidden}.fill{display:block;height:100%;border-radius:8px;background:var(--av-red-deep)}
.charts article:first-child{grid-column:1/-1}.evolution{overflow-x:auto;margin-top:10px}.evolution svg{display:block;width:100%;min-width:490px;max-height:340px}.evolution svg text{fill:#555;font-size:12px;font-family:var(--av-font-body)}.legend{display:flex;gap:18px;margin:12px 0 0;font-size:13px}.legend span:first-child{color:var(--av-red-deep)}.legend span:last-child{color:#101010}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.chips:empty{display:none}.chips button{width:auto;min-height:32px;border-color:#e7bcbc;background:#fff3f3;color:#871414;font-weight:800}.chips button span{margin-left:5px}
.time-filter{min-width:0;margin:10px 0;padding:0;border:0}.time-filter legend{font:500 12px var(--av-font-action);padding:0 0 5px}.time-options{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}.time-option{position:relative;display:block;margin:0}.time-option input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}.time-option span{display:grid;place-items:center;min-height:40px;padding:2px;border:1px solid var(--av-line);border-radius:7px;font-size:11px}.time-option input:checked+span{background:var(--av-red);border-color:var(--av-red);color:white;font-weight:800}.time-option input:focus-visible+span{outline:3px solid var(--av-black);outline-offset:1px}
@media(max-width:820px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--av-line)}.filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 10px}.brand{margin-bottom:10px}main{padding:16px}}
@media(max-width:560px){.cards,.charts{grid-template-columns:1fr}.metric strong{font-size:27px}}
.cards .metric{position:relative;min-height:136px;padding:10px 13px;border-top-width:3px}
.cards .metric h2{font-size:16px}
.cards .metric strong{font-size:22px;margin:2px 0}
.cards .metric .comparison{margin-top:3px}
.cards .metric-footer .nominal{font-size:15px;margin-top:2px}
#indicadores-meta{margin-top:10px}
.metric.metric-target{border-top-color:#155ab5;background:#f8fbff}
.metric-target h2{color:#174985}
.metric-target{--gauge-width:64px;--gauge-space:calc(var(--gauge-width) + 7px)}
.metric-target:has(.target-gauge) > :is(h2,strong,.metric-footer){padding-right:var(--gauge-space)}
.metric-target:has(.target-gauge) .metric-footer .nominal{margin-right:calc(-1 * var(--gauge-space))}
.target-gauge{position:absolute;top:10px;right:10px;width:var(--gauge-width);text-align:center}
.target-gauge-arc{position:relative;display:block;width:58px;height:29px;margin:auto;overflow:hidden}
.target-gauge-arc::before{content:"";position:absolute;inset:0 0 -100%;border-radius:50%;background:conic-gradient(from 270deg,#2370c9 0 var(--fill),#dce6f2 var(--fill) 180deg,transparent 180deg);mask:radial-gradient(transparent 56%,black 57%)}
.target-gauge-arc::after{content:"";position:absolute;top:0;left:calc(50% - 1px);width:2px;height:6px;background:#182c46}
.target-gauge-value{display:block;font-size:12px;font-weight:900;color:#174985;font-variant-numeric:tabular-nums}
.target-gauge small{font-size:11px}


.searchable-filter{min-width:0;max-width:100%;width:100%;min-height:40px;padding:6px 9px;border:1px solid var(--av-line);border-radius:8px;background:white;color:var(--av-black)}
.time-option{user-select:none;touch-action:pan-y}
.bars[data-metric=receita]{--bar-color:var(--av-series-1);--bar-highlight:var(--av-red-soft)}
.bars[data-metric=quantidade]{--bar-color:var(--av-series-2);--bar-highlight:#f1f1f1}
.bars[data-metric=preco]{--bar-color:var(--av-series-3);--bar-highlight:#f4f4f4}
.bars[data-metric] .fill{background:var(--bar-color)}
.ranking-panel{padding:10px 13px}
.ranking-panel h2{font-size:16px}
.ranking-panel :is(.ranking-modes button,select){width:auto;min-height:32px;font-size:13px}
.ranking-panel .bars{margin-top:8px}
.ranking-panel .bar{min-height:42px;padding:6px 8px;font-size:13px;gap:4px 8px}
.ranking-panel .track{position:relative;overflow:visible}
.ranking-modes{display:flex;gap:4px;flex-wrap:wrap}
.ranking-modes button[aria-pressed=true]{background:#303030;color:white}
.ranking-modes button[data-mode=meta][aria-pressed=true]{background:#155ab5}
.ranking-reference{grid-column:1/-1;color:#555;font-size:12px}
.ranking-reference[data-mode=meta]{color:#155ab5}
.ranking-marker{position:absolute;top:-3px;bottom:-3px;width:3px;background:#303030;transform:translateX(-50%);border:1px solid white;box-sizing:content-box}
.ranking-marker[data-mode=meta]{background:#155ab5}
.ranking-marker[data-mode=ytd]{top:50%;bottom:auto;width:15px;height:15px;border-radius:50%;transform:translate(-50%,-50%);border-color:#ffffffd9;background:#65656580}
.ranking-marker[data-mode=ytd].positive{background:#13754799}
.ranking-marker[data-mode=ytd].negative{background:#b7121899}
.ranking-delta{font-weight:800}
.bars[data-metric] button.bar:hover,.bars[data-metric] button.bar[aria-pressed=true]{background:var(--bar-highlight);border-bottom-color:var(--bar-color)}
.cards[hidden]{display:none}
</style>
<div class="layout">
<aside>
  <div class="brand"><img src="/logo-auto-visao.png" alt="Auto Visão Vistorias Automotivas">BI de Vendas</div>
  <h2>Filtros</h2>
  <form id="filtros" class="filters">
    <fieldset class="time-filter"><legend>Ano</legend><div id="tempo-ano" class="time-options"></div></fieldset>
    <fieldset class="time-filter"><legend>Semestre</legend><div id="tempo-semestre" class="time-options"></div></fieldset>
    <fieldset class="time-filter"><legend>Trimestre</legend><div id="tempo-trimestre" class="time-options"></div></fieldset>
    <fieldset class="time-filter"><legend>Mês</legend><div id="tempo-mes" class="time-options"></div></fieldset>
    <label>Unidade<select name="unidade"></select></label>
    <label>Produto / Serviço<select name="servico"></select></label>

  </section>
<footer class="av-footer"><strong>auto<span>visão</span> · BI de Vendas</strong><span>Uso interno · Vistorias Automotivas</span></footer>

<script src="/sessao.js"></script>

<script>
const form = document.querySelector('#filtros');
const statusLine = document.querySelector('#status');
const money = new Intl.NumberFormat('pt-BR', {style:'currency',currency:'BRL'});
const integer = new Intl.NumberFormat('pt-BR');
const compact = new Intl.NumberFormat('pt-BR', {notation:'compact'});
const date = value => value.split('-').reverse().join('/');
const months = new Intl.DateTimeFormat('pt-BR',{month:'long',timeZone:'UTC'});
const timeNames={ano:'Ano',semestre:'Semestre',trimestre:'Trimestre',mes:'Mês'};
function timeOptions(key, labels, checked) {
  const container=document.querySelector('#tempo-'+key);
  for(const [value,title] of labels) {
    const label=element('label',undefined,'time-option');
    const input=element('input');
    input.type='checkbox';
    input.name=key;
    input.value=value;
    input.defaultChecked=value===checked;
    label.append(input,element('span',title));
    container.append(label);
  }
}
timeOptions('semestre',[[1,'S1'],[2,'S2']]);
timeOptions('trimestre',Array.from({length:4},(_,i)=>[i+1,'T'+(i+1)]));
timeOptions('mes',Array.from({length:12},(_,i)=>[i+1,months.format(new Date(Date.UTC(2026,i,1))).slice(0,3)]));
const dimensions={servico:'Produto / Serviço',grupo:'Grupo de produto',vendedor:'Vendedor',unidade:'Unidade',segmento:'Segmento'};
const rankings={receita:'vendedor',quantidade:'unidade',preco:'servico'};
for(const [metric,initial] of Object.entries(rankings)) {
  for(const [key,label] of Object.entries(dimensions)) {
    form.elements[metric].add(new Option(label,key,key===initial,key===initial));
  }
}
function activeFilters() {
  const reportFilters=new URLSearchParams();
  const reportDimension=['vendedor','unidade'].find(name=>form.elements[name].value);
  if(reportDimension) reportFilters.set(reportDimension,form.elements[reportDimension].value);
  document.querySelector('#relatorio-cliente').href='/relatorio-cliente'+(reportFilters.size?'?'+reportFilters:'');
  const chips=[];
  function add(label, control, remove) {
    const chip=element('button',label);
    chip.type='button';
    chip.setAttribute('aria-label','Remover filtro '+label);
    chip.append(element('span','×'));
    chip.addEventListener('click',()=>{
      remove();
      refresh();
      control.focus();
    });
    chips.push(chip);
  }
  for(const input of form.querySelectorAll('.time-option input:checked')) {
    add(timeNames[input.name]+' · '+input.nextElementSibling.textContent,input,()=>{input.checked=false;});
  }
  for(const [key,title] of Object.entries({...dimensions,segmento:'Segmento',cliente:'Cliente'})) {
    const select=form.elements[key];
    if(select.value) add(title+' · '+select.selectedOptions[0].text,select,()=>{select.value='';});
  }
  document.querySelector('#ativos').replaceChildren(...chips);
}
function element(tag, text, cls) {
  const node = document.createElement(tag);
  if(text !== undefined) node.textContent = text;
  if(cls) node.className = cls;
  return node;
}
function populate(select, options, all) {
  const selected = select.value;
  select.replaceChildren(...(all ? [new Option('Todos','')] : []), ...options.map(v=>new Option(v,v)));
  if([...select.options].some(o=>o.value===selected)) select.value=selected;
}
function cards(data) {
  const metrics = ([count,cents]) => [cents/100,count ? cents/100/count : null,count];
  const actual=metrics(data.atual), prior=metrics(data.anterior);
  const names=['Receita','Preço Médio','Quantidade'];
  const priorLabel=data.recorte?'Período anterior':data.cortes.length===1?'Até '+date(data.cortes[0][1]):'Acumulados anteriores';
  const percent=new Intl.NumberFormat('pt-BR',{signDisplay:'exceptZero',maximumFractionDigits:1});
  function metricCard(name,i,reference,label,detailsLabel,missing,isTarget=false) {
    const format=v=>v===null?'—':i===2?integer.format(v):money.format(v);
    const delta=reference && actual[i]!==null ? ((actual[i]/reference-1)*100) : null;
    const nominal=reference!==null && actual[i]!==null ? actual[i]-reference : null;
    const panel=element('article',undefined,'panel metric');
    const comparison=element('small',undefined,'comparison');
    const change=delta===null?'—':percent.format(delta)+'%';
    comparison.append(element('span',change,'change '+(delta>0?'positive':delta<0?'negative':'')));
    comparison.append(' · '+label);
    const details=element('div');
    details.append(comparison,element('small',reference===null?missing:detailsLabel+' · '+format(reference)));
    const footer=element('div',undefined,'metric-footer');
    footer.append(details);
    if(nominal!==null) {
      const sign=nominal>0?'+':nominal<0?'−':'';
      footer.append(element('span','('+sign+format(Math.abs(nominal))+')',
        'nominal '+(nominal>0?'positive':nominal<0?'negative':'')));
    }
    panel.append(element('h2',isTarget?'Meta de '+name:name));
    panel.append(element('strong',format(actual[i])),footer);
    if(isTarget && reference>0 && actual[i]!==null) {
      const attainment=actual[i]/reference;
      const gauge=element('div',undefined,'target-gauge');
      const arc=element('span',undefined,'target-gauge-arc');
      arc.setAttribute('aria-hidden','true');
      arc.style.setProperty('--fill',Math.max(0,Math.min(2,attainment))*90+'deg');
      arc.title='Escala de 0% a 200%, com marca em 100%';
      const formatted=new Intl.NumberFormat('pt-BR',{style:'percent',maximumFractionDigits:1}).format(attainment);
      gauge.append(arc,element('span',formatted,'target-gauge-value'),element('small','da meta'));
      panel.append(gauge);
    }
    if(isTarget) panel.classList.add('metric-target');
    return panel;
  }
  document.querySelector('#indicadores').replaceChildren(...names.map((name,i)=>
    metricCard(name,i,data.anterior[0]?prior[i]:null,
      data.recorte?'Mesmo período do ano anterior':'YTD vs. ano anterior',
      priorLabel,priorLabel+' · sem dados')));
  const targetRow=document.querySelector('#indicadores-meta');
  targetRow.hidden=!data.meta;
  if (!data.meta) {
    targetRow.replaceChildren();
    return;
  }
  const targets=[data.meta.receita,data.meta.preco,data.meta.quantidade];
  targetRow.replaceChildren(...names.map((name,i)=>
    metricCard(name,i,targets[i]===null || i===2?targets[i]:targets[i]/100,
      'Realizado vs. meta','Meta do período','Meta indisponível para o recorte.',true)));
}
let rankingData;
const rankingModes={};
function bars(id, rows, metric=id) {
  const container=document.getElementById(id);
  container.dataset.metric=metric;
  const dimension=id==='clientes'?'cliente':form.elements[id]?.value;
  const select=dimension ? form.elements[dimension] : null;
  const mode=rankingModes[id] || 'realizado';
  const referenceLabel=mode==='meta'?'Meta':'Ano anterior';
  const metricValue=([,count,cents])=>metric==='quantidade'?count:metric==='preco'?(count?cents/100/count:null):cents/100;
  const referenceRows=mode==='realizado'?[]:rankingData['rankings_'+mode]?.[id] || [];
  const references=new Map(referenceRows.map(row=>[row[0],metricValue(row)]));
  const values=rows.map(row=>[row[0],metricValue(row)]).sort((a,b)=>b[1]-a[1]);
  const max=Math.max(1,...values.map(([name,value])=>Math.max(Math.abs(value),Math.abs(references.get(name) ?? 0))));
  const format=metric==='quantidade'?integer:money;
  const signedFormat=new Intl.NumberFormat('pt-BR',{...format.resolvedOptions(),signDisplay:'exceptZero'});
  const signedPercent=new Intl.NumberFormat('pt-BR',{style:'percent',maximumFractionDigits:1,signDisplay:'exceptZero'});
  const nodes=values.map(([name,value])=>{
    const row=element(select?'button':'div',undefined,'bar');
    if(select) {
      row.type='button';
      row.setAttribute('aria-label','Filtrar '+name);
      row.setAttribute('aria-pressed',select.value===name);
      row.addEventListener('click',()=>{
        select.value=select.value===name?'':name;
        refresh();
      });
    }
    const track=element('span',undefined,'track');
    const fill=element('span',undefined,'fill');
    fill.style.width=(100*Math.abs(value)/max)+'%';
    track.append(fill);
    row.append(element('span',name),element('strong',format.format(value)),track);
    if(mode!=='realizado') {
      const reference=references.get(name);
      const caption=element('small',reference==null?referenceLabel+' indisponível':referenceLabel+' · '+format.format(reference),'ranking-reference');
      caption.dataset.mode=mode;
      row.append(caption);
      if(reference!=null) {
        const marker=element('span',undefined,'ranking-marker');
        marker.dataset.mode=mode;
        if(mode==='ytd') {
          const delta=value-reference;
          const direction=delta>0?'positive':delta<0?'negative':'';
          if(direction) marker.classList.add(direction);
          const percent=reference===0?'': ' ('+signedPercent.format(delta/Math.abs(reference))+')';
          caption.append(element('span',' · '+signedFormat.format(delta)+percent,'ranking-delta '+direction));
        }
        marker.style.left=(100*Math.abs(reference)/max)+'%';
        marker.setAttribute('aria-hidden','true');
        track.append(marker);
      }
    }
    return row;
  });
  container.replaceChildren(...(nodes.length?nodes:[element('p','Sem dados no período.')]));
}
let evolutionData;
let evolutionMode='ytd';
function evolution(data) {
  evolutionData=data;
  const container=document.querySelector('#evolucao');
  const metric=document.querySelector('#metrica-evolucao').value;
  const quantity=metric==='quantidade';
  const targetMode=evolutionMode==='meta';
  const current=new Map(),previous=new Map();
  const rows=targetMode?[...data.evolucao.filter(row=>row[2]===0),...data.evolucao_metas]:data.evolucao;
  for(const [year,period,series,count,cents] of rows) {
    if(metric==='preco' && !count) continue;
    const value=quantity?count:metric==='preco'?cents/100/count:cents/100;
    (series?previous:current).set(year+'|'+period,value);
  }
  const periods=[...new Set([...current.keys(),...previous.keys()])].sort();
  const colors=['#BF1515',targetMode?'#155ab5':'#B5B5B5'];
  const legends=targetMode?['Realizado','Meta']:data.cortes.length===1?data.cortes[0].map(d=>d.slice(0,4)):['Ano selecionado','Ano anterior'];
  document.querySelector('#legenda-evolucao').replaceChildren(...legends.map((label,i)=>{
    const item=element('span','■ '+label);
    item.style.color=i===0 || targetMode?colors[i]:'#656565';
    return item;
  }));
  if(targetMode && !previous.size) {
    container.replaceChildren(element('p','Meta indisponível para o recorte.'));
    return;
  }
  if(!periods.length){container.replaceChildren(element('p','Sem dados no período.'));return;}
  function svgNode(tag,attrs,label) {
    const node=document.createElementNS('http://www.w3.org/2000/svg',tag);
    for(const [key,value] of Object.entries(attrs)) node.setAttribute(key,value);
    if(label!==undefined) node.textContent=label;
    return node;
  }
  const width=Math.max(900,periods.length*62+110);
  const left=92,right=width-22,top=16,bottom=166;
  const chart=svgNode('svg',{viewBox:'0 0 '+width+' 195',role:'img','aria-label':targetMode?'Realizado e meta por período':'Comparação por período entre os anos'});
  if(periods.length>12) chart.style.minWidth=width+'px';
  const values=[...current.values(),...previous.values()];
  const min=Math.min(...values),max=Math.max(...values);
  const gap=Math.max((max-min)*.18,Math.abs(max)*.02,1);
  const low=min>0?Math.max(0,min-gap):Math.min(0,min-gap);
  const high=Math.max(0,max+gap);
  const format=quantity?integer:money;
  const y=value=>bottom-(value-low)/(high-low)*(bottom-top);
  for(let i=0;i<=4;i++){
    const value=low+(high-low)*i/4, line=y(value);
    chart.append(svgNode('line',{x1:left,x2:right,y1:line,y2:line,stroke:'#ddd','stroke-dasharray':'3 4'}),
      svgNode('text',{x:left-9,y:line+4,'text-anchor':'end'},metric==='preco'?money.format(value):(quantity?'':'R$ ')+compact.format(value)));
  }
  const step=(right-left)/periods.length,barWidth=Math.min(42,step*.33);
  periods.forEach((key,i)=>{
    const x=left+step*(i+.5);
    const [year,period]=key.split('|');
    const name=/^\d{2}$/.test(period)?months.format(new Date(Date.UTC(2026,Number(period)-1,1))).slice(0,3):period;
    const label=data.cortes.length>1?name+'/'+year.slice(2):name;
    const baseline=y(Math.max(0,low));
    [current,previous].forEach((series,j)=>{
      if(!series.has(key)) return;
      const value=series.get(key),height=y(value);
      const bar=svgNode('rect',{x:x+(j===0?-barWidth-2:2),y:Math.min(height,baseline),width:barWidth,height:Math.max(1,Math.abs(height-baseline)),rx:3,fill:colors[j]});
      bar.append(svgNode('title',{},name+' · '+(targetMode?year+' · '+legends[j]:Number(year)-j)+' · '+format.format(value)));
      chart.append(bar);
    });
    chart.append(svgNode('text',{x,y:bottom+21,'text-anchor':'middle'},label));
  });
  container.replaceChildren(chart);
}
const comparisonButtons=document.querySelectorAll('#comparacao-vendas button');
for(const button of comparisonButtons) {
  button.addEventListener('click',()=>{
    evolutionMode=button.dataset.mode;
    for(const option of comparisonButtons) option.setAttribute('aria-pressed',String(option===button));
    if(evolutionData) evolution(evolutionData);
  });
}
document.querySelector('#metrica-evolucao').addEventListener('change',()=>{
  if(evolutionData) evolution(evolutionData);
});
const clientMetric=document.querySelector('#metrica-clientes');
for(const id of [...Object.keys(rankings),'clientes']) {
  const panel=document.getElementById(id).closest('article');
  panel.classList.add('ranking-panel');
  const controls=element('div',undefined,'ranking-modes');
  controls.setAttribute('role','group');
  controls.setAttribute('aria-label','Comparativo de '+panel.querySelector('h2').textContent);
  for(const [mode,label] of [['realizado','Real'],['ytd','YTD'],['meta','Meta']]) {
    const button=element('button',label);
    button.type='button';
    button.dataset.mode=mode;
    button.setAttribute('aria-pressed',String(mode==='realizado'));
    button.addEventListener('click',()=>{
      rankingModes[id]=mode;
      for(const option of controls.children) option.setAttribute('aria-pressed',String(option===button));
      if(rankingData) renderRanking(id);
    });
    controls.append(button);
  }
  panel.querySelector('h2').after(controls);
}
function renderRanking(id) {
  if(id==='clientes') bars(id,rankingData.clientes,clientMetric.value);
  else bars(id,rankingData.rankings[id]);
}
clientMetric.addEventListener('change',()=>{if(rankingData) renderRanking('clientes');});
let revision=0, initialized=false;
async function refresh() {
  syncSearchFilters(form);
  const current=++revision;
  activeFilters();
  statusLine.textContent='Consultando histórico…';
  try {
    const params=new URLSearchParams(new FormData(form));
    if(initialized && !params.has('ano')) params.set('ano','todos');
    const response=await fetch('/api/visao?'+params);
    if(!response.ok) throw Error('Consulta indisponível');
    const data=await response.json();
    if(current!==revision) return;
    if(!initialized) {
      timeOptions('ano',data.anos.map(year=>[year,year]),data.anos.at(-1));
      for(const [key,values] of Object.entries(data.opcoes)) populate(form.elements[key],values,true);
      initialized=true;
    }
    activeFilters();
    statusLine.textContent=data.cortes.length?(data.recorte?'Período selecionado · ':'YTD até ')+data.cortes.map(pair=>data.recorte?pair[0].slice(0,4):date(pair[0])).join(' · '):'Sem dados para a combinação de períodos.';
    cards(data);
    evolution(data);
    rankingData=data;
    for(const id of [...Object.keys(rankings),'clientes']) renderRanking(id);
  } catch {
    if(current===revision) statusLine.textContent='Não foi possível carregar o painel.';
  }
}
document.addEventListener('change',event=>{
  if(event.target.form!==form) return;
  refresh();
});
form.addEventListener('submit',event=>event.preventDefault());
form.addEventListener('reset',()=>setTimeout(()=>refresh(),0));
enableTimeRangeDrag(form);
makeSearchableFilters(form,['unidade','servico','grupo','vendedor','segmento','cliente']);
refresh();
</script>
